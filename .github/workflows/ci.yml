name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    paths-ignore: ['**/*.md', '.claude/**', 'scripts/issue.sh']
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', '.claude/**', 'scripts/issue.sh']

permissions:
  contents: read

concurrency:
  # label events in their own groups: adding a label must not cancel a running build, and a label other than `e2e`
  # (it starts nothing, see the e2e job) must not cancel the run that adding `e2e` started
  group: ci-${{ github.ref }}-${{ github.event.action != 'labeled' && 'run' || github.event.label.name == 'e2e' && 'e2e-label' || 'other-label' }}
  cancel-in-progress: true

jobs:
  check:
    name: Build and test
    if: github.event.action != 'labeled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test --if-present

  # Playwright costs Actions minutes: on PRs labeled `e2e` (runs again on each push while the label is on; every PR
  # gets the label before its merge, AGENTS.md), when started by hand, and on pushes to main as a safety net: the
  # merge gate is a rule, not a GitHub setting (no branch protection on this plan). Locally `npm run test:e2e` is mandatory before every PR (AGENTS.md).
  e2e:
    name: E2E (Playwright)
    # a label event only counts when the label just added is `e2e` itself: `in review`, `changes requested` and the
    # like are added to PRs that already carry it and must not start another run on code that already ran
    if: >-
      github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'e2e') &&
       (github.event.action != 'labeled' || github.event.label.name == 'e2e'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - id: pw
        run: echo "version=$(npx playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ steps.pw.outputs.version }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      # saved right away: a failed test run must not cost the next one the download
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ steps.pw.outputs.version }}
      - if: steps.cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
