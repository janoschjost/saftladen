name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    paths-ignore: ['**/*.md']
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']

permissions:
  contents: read

concurrency:
  # label events in their own group: adding any label must not cancel a running build
  group: ci-${{ github.ref }}-${{ github.event.action == 'labeled' && 'label' || 'run' }}
  cancel-in-progress: true

jobs:
  check:
    name: Build and test
    if: github.event.action != 'labeled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test --if-present

  # Playwright costs Actions minutes: on pushes to main, on PRs labeled `e2e` (runs again on each push while the label
  # is on) or when started by hand. Locally `npm run test:e2e` is mandatory before every PR (AGENTS.md).
  e2e:
    name: E2E (Playwright)
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'e2e')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - id: pw
        run: echo "version=$(npx playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ steps.pw.outputs.version }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      # saved right away: a failed test run must not cost the next one the download
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ steps.pw.outputs.version }}
      - if: steps.cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
