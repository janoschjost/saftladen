name: Deploy

# Builds main once, rsyncs dist/ to STAGING over SSH, then to PRODUCTION (only if staging succeeded).
# Secrets live in the GitHub environments `Staging (Janosch Infomaniak)` and `Production (Infomaniak)`
# (Settings → Environments), same names in both:
#   DEPLOY_HOST        host name of the server
#   DEPLOY_USER        SSH user
#   DEPLOY_PATH        absolute target dir, e.g. /var/www/example.com/htdocs/ (trailing slash)
#   DEPLOY_SSH_KEY     private key (no passphrase), its public half is in the server's authorized_keys
#   DEPLOY_KNOWN_HOSTS output of `ssh-keyscan -H <host>`
#   DEPLOY_PORT        optional, default 22

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', '.claude/**', 'scripts/issue.sh']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test --if-present
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  deploy-staging:
    name: Deploy (staging)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: "Staging (Janosch Infomaniak)"
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Prepare SSH
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      # hashed assets first, index.html last, so visitors never get an index that points to files not uploaded yet
      - name: Upload
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER_: ${{ secrets.DEPLOY_USER }}
          TARGET: ${{ secrets.DEPLOY_PATH }}
          PORT: ${{ secrets.DEPLOY_PORT || '22' }}
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -p $PORT"
          rsync -rlt -e "$SSH" --exclude=index.html dist/ "$USER_@$HOST:$TARGET"
          rsync -rlt -e "$SSH" dist/index.html "$USER_@$HOST:$TARGET"
          # remove files no longer in the build
          rsync -rlt --delete -e "$SSH" dist/ "$USER_@$HOST:$TARGET"

  deploy-production:
    name: Deploy (production)
    needs: deploy-staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: "Production (Infomaniak)"
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Prepare SSH
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Upload
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER_: ${{ secrets.DEPLOY_USER }}
          TARGET: ${{ secrets.DEPLOY_PATH }}
          PORT: ${{ secrets.DEPLOY_PORT || '22' }}
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -p $PORT"
          rsync -rlt -e "$SSH" --exclude=index.html dist/ "$USER_@$HOST:$TARGET"
          rsync -rlt -e "$SSH" dist/index.html "$USER_@$HOST:$TARGET"
          rsync -rlt --delete -e "$SSH" dist/ "$USER_@$HOST:$TARGET"
